{% extends "base.html" %}
{% block title %}Login – Golf Shot Tracker{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <div class="bg-white shadow rounded-xl p-8">
    <div class="text-center mb-6">
      <div class="text-5xl mb-2">⛳</div>
      <h1 class="text-2xl font-bold text-gray-800">Golf Shot Tracker</h1>
      <p class="text-sm text-gray-500 mt-1">Sign in with your Garmin Connect account</p>
    </div>

    <form method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Garmin Email</label>
        <input type="email" name="email" required autofocus
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500"
               placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-500" />
      </div>
      <button type="submit"
              class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition">
        Sign In &amp; Sync
      </button>
    </form>

    <p class="text-xs text-gray-400 mt-4 text-center">
      Your credentials are used only to fetch data from Garmin Connect.<br>
      They are stored in your browser session only.
    </p>
  </div>
</div>
{% endblock %}
